[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "llm-tok-eval"
version = "0.1.0"
description = "Evaluate LLM-based Japanese word segmentation against MeCab"
readme = "README.md"
license = "0BSD"
license-files = ["LICENSE", "THIRD_PARTY_NOTICES.md"]
authors = [{ name = "R-J Lim", email = "kgerbil@gmail.com" }]
requires-python = ">=3.11"
dependencies = [
    "fugashi>=1.3",
    "unidic-lite>=1.0.8",
    "openai>=1.40",
    "pandas>=2.2",
    "numpy>=1.26",
    "matplotlib>=3.8",
    "seaborn>=0.13",
    "pyarrow>=16",
    "pyyaml>=6.0",
    "python-dotenv>=1.0",
    "tqdm>=4.66",
]

[project.optional-dependencies]
gold = ["datasets>=4.0,<6"]
sudachi = ["sudachipy>=0.6", "sudachidict-core>=20240109"]

[project.scripts]
tok-eval = "tok_eval.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/tok_eval"]
